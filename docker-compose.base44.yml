services:
  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    command: >
      sh -c "sed -i 's/^user .*/user root;/' /etc/nginx/nginx.conf && printf 'server {\n listen 80;\n root /usr/share/nginx/html;\n index index.html;\n sendfile on;\n add_header Cache-Control \"no-store\";\n}\n' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
